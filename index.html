<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePen Like Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .controls button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-left: 8px;
        }

        .controls button:hover {
            background: #1177bb;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editors {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
        }

        .editor-tabs {
            display: flex;
            background: #252526;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #2d2d2d;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .tab.active {
            background: #1e1e1e;
            border-bottom: 2px solid #0e639c;
            color: #4fc1ff;
        }

        .editor-area {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .preview {
            width: 50%;
            background: white;
            position: relative;
        }

        .preview-header {
            background: #f0f0f0;
            color: #333;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: calc(100% - 37px);
            border: none;
            background: white;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .editors, .preview {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>⚡ CodePen Like Editor</h1>
    <div class="controls">
        <button onclick="runCode()">▶ Run</button>
        <button onclick="clearAll()">Clear All</button>
    </div>
</header>

<div class="main">
    <!-- Editors -->
    <div class="editors">
        <div class="editor-tabs">
            <div class="tab active" onclick="switchTab('html')">HTML</div>
            <div class="tab" onclick="switchTab('css')">CSS</div>
            <div class="tab" onclick="switchTab('js')">JS</div>
        </div>

        <div class="editor-area">
            <textarea id="htmlCode" placeholder="HTML লিখুন...">
<div class="box">
  <h1>Hello World!</h1>
  <p>এটি CodePen-এর মতো লাইভ এডিটর</p>
  <button onclick="changeColor()">রঙ পরিবর্তন করুন</button>
</div>
            </textarea>

            <textarea id="cssCode" style="display:none;" placeholder="CSS লিখুন...">
body {
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

.box {
  text-align: center;
  background: rgba(255,255,255,0.15);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

button {
  margin-top: 20px;
  padding: 12px 24px;
  font-size: 16px;
  border: none;
  border-radius: 50px;
  background: #ff6b6b;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #ee5a5a;
}
            </textarea>

            <textarea id="jsCode" style="display:none;" placeholder="JavaScript লিখুন...">
function changeColor() {
  const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'];
  const random = colors[Math.floor(Math.random() * colors.length)];
  document.body.style.background = random;
}
            </textarea>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview">
        <div class="preview-header">
            <span>Preview</span>
            <span style="font-size: 0.8rem; color: #666;">Live Output</span>
        </div>
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    // Tab switching
    function switchTab(type) {
        // Hide all textareas
        document.getElementById('htmlCode').style.display = 'none';
        document.getElementById('cssCode').style.display = 'none';
        document.getElementById('jsCode').style.display = 'none';

        // Remove active class
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));

        // Show selected
        if (type === 'html') {
            document.getElementById('htmlCode').style.display = 'block';
            document.querySelectorAll('.tab')[0].classList.add('active');
        } else if (type === 'css') {
            document.getElementById('cssCode').style.display = 'block';
            document.querySelectorAll('.tab')[1].classList.add('active');
        } else {
            document.getElementById('jsCode').style.display = 'block';
            document.querySelectorAll('.tab')[2].classList.add('active');
        }
    }

    // Run the code
    function runCode() {
        const html = document.getElementById('htmlCode').value;
        const css = document.getElementById('cssCode').value;
        const js = document.getElementById('jsCode').value;

        const result = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>${css}</style>
            </head>
            <body>
                ${html}
                <script>${js}<\/script>
            </body>
            </html>
        `;

        const iframe = document.getElementById('preview');
        iframe.srcdoc = result;
    }

    // Clear all
    function clearAll() {
        document.getElementById('htmlCode').value = '';
        document.getElementById('cssCode').value = '';
        document.getElementById('jsCode').value = '';
        runCode();
    }

    // Auto run on load
    window.onload = runCode;

    // Optional: Auto-run while typing (uncomment if you want)
    // document.getElementById('htmlCode').addEventListener('input', runCode);
    // document.getElementById('cssCode').addEventListener('input', runCode);
    // document.getElementById('jsCode').addEventListener('input', runCode);
</script>

</body>
</html>
